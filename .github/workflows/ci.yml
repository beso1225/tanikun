name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      - name: Verify Node.js version
        run: test "$(node --version)" = "v$(cat .node-version)"
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df
        with:
          extra-conf: |
            sandbox = true
      - name: Require an enabled Nix sandbox
        run: test "$(nix config show sandbox)" = true
      - name: Run linters and format checks
        run: |
          nix develop path:. -c bash -eu <<'SCRIPT'
            pnpm install --frozen-lockfile
            just lint
          SCRIPT

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
      - name: Enable corepack
        run: corepack enable
      - name: Verify Node.js version
        run: test "$(node --version)" = "v$(cat .node-version)"
      - uses: DeterminateSystems/nix-installer-action@2cb76beab460be7e44442c7ebdcbc30b638416df
        with:
          extra-conf: |
            sandbox = true
      - name: Require an enabled Nix sandbox
        run: test "$(nix config show sandbox)" = true
      - name: Evaluate both supported systems
        run: nix flake check path:. --all-systems --no-build
      - name: Build release assets in the Nix sandbox
        run: nix build path:.#release
      - name: Check MoonBit, CSS extraction, and packaged artifacts
        run: nix flake check path:. -L
      - name: Rebuild release packages with fetching disabled
        run: nix build path:.#web path:.#api --offline --rebuild --no-link
      - name: Verify the built page in Chromium
        run: |
          nix build path:.#web --out-link result-web
          nix develop path:. -c env TANIKUN_WEB_DIST="$PWD/result-web" \
            node --test tests/integration/browser.test.mjs
      - name: Exercise local Workers runtime and Phase 0 spikes
        run: |
          nix build path:.#mooncakes --out-link result-mooncakes
          nix develop path:. -c bash -eu <<'SCRIPT'
            export MOON_HOME="$(mktemp -d)"
            cp -R result-mooncakes/registry "$MOON_HOME/registry"
            chmod -R u+w "$MOON_HOME"
            pnpm install --frozen-lockfile
            just test-worker
            just test-automerge
            just test-d1
          SCRIPT
