allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  workerd: true

# pnpm 12 defaults to a one-day release-age quarantine. This repository pins
# exact versions in pnpm-lock.yaml and relies on the lockfile for review.
minimumReleaseAge: 0

# The Nix dev shell pins pnpm itself; do not add pnpm to the lockfile as an
# environment dependency.
pmOnFail: ignore
