<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>応物単位くん</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const dialog = () =>
          document.querySelector('[role="dialog"][aria-modal="true"]');
        let returnFocus = null;
        let removedFocusId = null;
        let pendingValidation = false;
        let pendingUndo = false;
        let hiddenSettingsOpen = false;
        document.addEventListener(
          "click",
          (event) => {
            const button = event.target.closest("button");
            if (!button) return;
            if (button.id === "remove-detail") removedFocusId = returnFocus?.id;
            if (button.id === "open-hidden-settings") hiddenSettingsOpen = true;
            if (button.id === "undo-removal-button") pendingUndo = true;
            if (
              button.id === "custom-submit" ||
              button.id === "override-submit"
            ) {
              pendingValidation = true;
            }
            if (!dialog() && button.id !== "undo-removal-button") {
              returnFocus = button;
            }
          },
          true,
        );
        new MutationObserver(() => {
          const panel = dialog();
          if (pendingValidation) {
            pendingValidation = false;
            const invalid = panel?.querySelector('[aria-invalid="true"]');
            const target = invalid?.matches("input, select, textarea, button")
              ? invalid
              : invalid?.querySelector("input, select, textarea, button");
            if (target) {
              target.focus();
              return;
            }
          }
          if (pendingUndo && !document.querySelector("#undo-removal")) {
            pendingUndo = false;
            const restored = document.getElementById(removedFocusId);
            const target = restored?.getClientRects().length
              ? restored
              : document.querySelector("#open-catalogue-picker");
            removedFocusId = null;
            returnFocus = null;
            target?.focus();
            return;
          }
          if (panel && !panel.contains(document.activeElement)) {
            (
              panel.querySelector("input") ??
              panel.querySelector("[data-dialog-close]") ??
              panel.querySelector("button")
            )?.focus();
          }
          if (!panel && hiddenSettingsOpen) {
            hiddenSettingsOpen = false;
            const target =
              document.querySelector("#open-hidden-settings") ??
              document.querySelector("#open-settings");
            returnFocus = null;
            target?.focus();
            return;
          }
          if (panel || !returnFocus) return;
          const target = returnFocus;
          returnFocus = null;
          if (target.isConnected) target.focus();
        }).observe(document.querySelector("#app"), {
          childList: true,
          subtree: true,
        });
        const focusable = () =>
          Array.from(
            dialog()?.querySelectorAll(
              'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])',
            ) ?? [],
          ).filter((element) => element.getClientRects().length > 0);
        document.addEventListener(
          "keydown",
          (event) => {
            if (!dialog()) return;
            if (event.key === "Escape") {
              event.preventDefault();
              dialog().querySelector("[data-dialog-close]")?.click();
              return;
            }
            if (event.key !== "Tab") return;
            const items = focusable();
            if (items.length === 0) return;
            const first = items[0];
            const last = items[items.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          },
          true,
        );
      })();
    </script>
  </body>
</html>
